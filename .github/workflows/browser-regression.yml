# NetOps Lab — 每周浏览器级回归（issue #78）。
#
# 为什么是每周而不是每次 push：
#   - push 级 CI（ci.yml）只跑纯函数门禁（go test / vitest / tsc）；
#   - 浏览器级回归三脚本（w17 40 断言 + w28 14 断言 + w47 14 断言 = 68 断言）
#     需要 agent-browser + Chrome，单次全程 ~10 分钟。每次 push 跑会把
#     免费配额烧穿（#76 的教训：私有仓库 2000 分钟/月，windows 已计 2x）。
#   - 周一 03:00 UTC 跑最新 main，肉眼/robots 看结果；workflow_dispatch
#     支持随时手动触发（发布前、或改了地图/工作台 UI 之后）。
#
# 注意（诚实记录）：配额耗尽期间本 job 无法实跑验证，首次真实执行要在
# spending limit 恢复后进行；届时若 agent-browser 的浏览器探测在 CI 环境
# 失败，看「browser smoke」步骤的报错输出定位。
name: browser-regression

on:
  schedule:
    # 周一 03:00 UTC（北京周一 11:00）—— 避开周末，出问题当天有人看。
    - cron: '0 3 * * 1'
  workflow_dispatch:

# 同 #76 的理由：并发去重，只跑最新一次调度，不重复计费。
concurrency:
  group: browser-regression
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install agent-browser (public npm CLI driving real Chrome)
        run: npm install -g agent-browser
      - name: browser smoke (fail fast if no Chrome is found)
        run: |
          agent-browser --version
          agent-browser open about:blank
          agent-browser close
      - name: build frontend (dist embedded + mapdata assets)
        run: cd web && npm ci && npm run build
      - name: w47 workbench UI regression (14 assertions)
        run: bash scripts/w47_browser_regression.sh
      - name: w28 real-network-data layers regression (14 assertions)
        run: bash scripts/w28_browser_regression.sh
      - name: w17 geo workbench regression (40 assertions)
        run: bash scripts/w17_browser_regression.sh
      # 断言失败时把脚本留在 repo tmp/ 的截图带回来看（脚本约定：截图不进 download/）。
      - name: upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-screenshots
          path: tmp/*.png
          retention-days: 14
