# NetOps Lab CI.
#
# The go job builds the frontend first: SPA-serving API tests embed
# internal/webui/dist, which is empty (only .gitkeep) until `vite build`
# runs — mirroring the local `make build` dependency on `make web`.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build frontend (embedded by go:embed)
        run: cd web && npm ci && npm run build
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 -timeout 15m ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: build (tsc strict + vite)
        run: npm run build

  # Issue #38: the user's actual environment is Windows, so the test gate
  # must hold there too — the linux job alone let 15 platform failures
  # (TempDir cleanup, POSIX path assertions, chmod semantics) ship through
  # v0.7.0/v0.8.0. Mirrors the go job (frontend build included: the webui
  # tests embed internal/webui/dist). Windows minutes bill at 2x; the job
  # is worth that only because it is the user's platform.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build frontend (embedded by go:embed)
        run: cd web && npm ci && npm run build
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
        shell: bash
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 -timeout 25m ./...
