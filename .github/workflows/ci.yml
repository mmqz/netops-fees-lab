# NetOps Fees Lab CI.
#
# The fees repo split out of mmqz/netops-lab at v0.17.0 carrying the whole
# fee domain: the import/snapshot/parquet pipeline, the risk scenarios,
# the DuckDB analysis engine (its build tag and end-to-end tests), and
# the /fees web workbench. The main repo's ci.yml explicitly hands the
# duckdb job over ("which carries its own CI") — this file IS that CI,
# plus the windows gate that issue #1 (复验) and #14 (平台假设) ask for.
#
# The go job builds the frontend first: SPA-serving API tests embed
# internal/webui/dist, which is empty (only .gitkeep) until `vite build`
# runs — mirroring the local `make test` dependency on `make web`
# (the Makefile's issue-#13 pre-check gives the same instruction).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The account's Actions spending limit was exhausted on 2026-10-11
# (private repo, free 2000 min/month; windows bills 2x) and jobs die in
# ~4s with "recent account payments have failed or your spending limit
# needs to be increased" (the main repo's ci.yml carries the same note).
# Nothing in this file can fix that — it is an account-level action
# (Settings → Billing & plans). What code CAN do is stop burning minutes
# once the quota resets: cancel-in-progress drops superseded runs from
# rapid push chains so only the newest commit actually bills.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux, default build tag: the full write/import/rules/management
  # surface (the query presets honestly answer 501 engine_not_built).
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build frontend (embedded by go:embed)
        run: cd web && npm ci && npm run build
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      # W3 (#33): staticcheck zero-warning gate, three faces in one step —
      # the default build, the duckdb build tag, and the Windows GOOS (the
      # repo's one *_windows.go file is invisible to a Linux-only scan;
      # GOOS=windows + CGO_ENABLED=0 type-checks it from here, no extra
      # billed Windows minutes).
      - name: staticcheck (W3 #33: default + duckdb + windows-GOOS)
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
          go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 -tags duckdb ./...
          # The Windows GOOS face needs the HOST binary run under GOOS=windows
          # (go run would cross-compile the TOOL itself into a Windows .exe
          # and then fail to exec it — exec format error, the first try of
          # this step died exactly there).
          GOBIN="$(go env GOPATH)/bin" go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          CGO_ENABLED=0 GOOS=windows "$(go env GOPATH)/bin/staticcheck" ./...
      - name: go test
        run: go test -count=1 -timeout 15m ./...

  # Linux, the duckdb build tag: the analysis engine's real acceptance —
  # risk scenarios, ledger-consistency rules, and the #2 custom-rules
  # preset run against the REAL engine (CGO + gcc, mirroring
  # `make build-duckdb`). This is the job the main repo handed over.
  duckdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build frontend (embedded by go:embed)
        run: cd web && npm ci && npm run build
      - name: go vet (duckdb)
        run: go vet -tags duckdb ./...
      - name: go test (duckdb)
        run: go test -count=1 -tags duckdb -timeout 25m ./...
      # Issue #34: a green run used to prove the code and then throw the
      # binary away — Windows operators had no way to obtain the CGO/duckdb
      # build at all (docker builds stall 40+ minutes on go-duckdb's small-
      # file IO storm under Docker Desktop's bind mounts; WSL2 is not a
      # given on every contributor machine). The test step above already
      # compiled the whole dependency tree, so this build is cache-warm and
      # adds seconds, not minutes. The command is byte-identical to
      # scripts/release.sh's duckdb asset build, so the CI artifact and the
      # Release asset are the same build of the same tested tree.
      # Download from any platform:
      #   gh run download <run-id> -n netopsfees-linux-amd64-duckdb
      - name: build linux binary (duckdb, release-identical command)
        run: CGO_ENABLED=1 go build -tags duckdb -o netopsfees ./cmd/netopsfees
      - name: upload binary artifact (#34)
        uses: actions/upload-artifact@v4
        with:
          name: netopsfees-linux-amd64-duckdb
          path: netopsfees
          retention-days: 30
      # Issue #37 (its root cause measured in #35): a green run used to prove
      # the CODE and stop there — the documented artifact path could still be
      # broken (the #34 acceptance verified "it runs" on the BUILD machine's
      # own Ubuntu 24.04, which asserts nothing about the documented base
      # image; the user's bookworm-slim run died with GLIBC_2.38 not found).
      # 文档即测试: extract THE Dockerfile example out of docs/fees-layer.md
      # §5.2 (the single source of truth — the extractor also refuses a
      # missing GLIBC floor note, #35 acceptance 4), build it against the
      # binary this job just produced, boot it, and assert health + the
      # DuckDB engine. The doc regresses (wrong base image, dropped note)
      # → THIS step goes red, not the user's docker run.
      - name: verify artifact runs in the documented base image (#37)
        run: |
          set -e
          python3 scripts/extract-doc-dockerfile.py docs/fees-layer.md > /tmp/Dockerfile.artifact
          docker build -f /tmp/Dockerfile.artifact -t artifact-test .
          docker run -d --name artifact-test -p 18080:8080 artifact-test \
            serve --addr :8080 --db /data/netops.db --data-dir /data --auth-token ci-verify
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health 2>/dev/null | grep -q '"version"'; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:18080/api/health | grep -q '"version"'; then
            echo "::error::the documented container never answered /api/health with a version object"
            docker logs artifact-test || true
            exit 1
          fi
          docker exec artifact-test /app/netopsfees fees --db /data/netops.db --data /data \
            query monthly --type electricity --year 2026 > /tmp/engine-check.out 2>&1 || true
          if grep -q '引擎未编译' /tmp/engine-check.out; then
            echo "::error::the artifact's DuckDB engine is missing (引擎未编译)"
            docker logs artifact-test || true
            exit 1
          fi
          docker rm -f artifact-test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      # #22: case-collision gate — case-insensitive platforms (Windows) cannot
      # build a tree where two files differ only by letter case; run before
      # build so the collision dies here, not in a Windows checkout.
      - name: case-collision gate (#22)
        run: npm run lint:case
      - name: build (tsc strict + vite)
        run: npm run build
      - name: test (vitest)
        run: npm test

  # Issue #1 (复验) / #14 (平台假设): the user's actual environment is
  # Windows, so the default-tag gate must hold there too — the linux job
  # alone cannot see TempDir cleanup, path separator or chmod semantics
  # regressions. The duckdb engine has NO Windows path (mingw-w64 lacks
  # rstrtmgr — documented, its queries answer 501 with the Docker/WSL2
  # guidance), so this job runs the DEFAULT tag only, exactly like the
  # local `make test` a Windows operator runs. Windows minutes bill at
  # 2x; the job is worth that only because it is the user's platform.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build frontend (embedded by go:embed)
        run: cd web && npm ci && npm run build
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
        shell: bash
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 -timeout 25m ./...
