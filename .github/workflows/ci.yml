# NetOps Lab CI.
#
# The go job builds the frontend first: SPA-serving API tests embed
# internal/webui/dist, which is empty (only .gitkeep) until `vite build`
# runs — mirroring the local `make build` dependency on `make web`.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Issue #76 follow-up: the account's Actions spending limit was exhausted on
# 2026-10-11 (private repo, free 2000 min/month; windows bills 2x) and every
# job since then dies in ~4s with "The job was not started because recent
# account payments have failed or your spending limit needs to be increased".
# Nothing in this file can fix that — it is an account-level action
# (Settings → Billing & plans). What code CAN do is stop burning minutes once
# the quota resets: cancel-in-progress drops superseded runs from rapid
# push chains so only the newest commit actually bills.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build frontend (embedded by go:embed)
        run: cd web && npm ci && npm run build
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 -timeout 15m ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: build (tsc strict + vite)
        run: npm run build
      - name: test (vitest — #62 起的前端纯函数单测)
        run: npm test

  # The fee analysis engine (issue #58/#60/#61): DuckDB via go-duckdb is
  # CGO and deliberately NOT part of the default build (engine_std.go
  # answers ErrEngineNotBuilt) — the windows job and CGO-free environments
  # keep building/testing the full write path. This linux-only job compiles
  # with -tags duckdb and runs the engine end-to-end (read_parquet hive
  # partitioning, the totals/duplicates presets over a real import).
  duckdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: go vet (duckdb build, all packages)
        run: CGO_ENABLED=1 go vet -tags duckdb ./...
      # NOTE: never put a bare "#NN" or a "colon+space" inside a step name —
      # YAML reads " #" as a comment start and ": " as a mapping separator;
      # either one makes the WHOLE workflow file stop parsing (issue #76:
      # every push since 389fc10 produced an empty failure run with zero
      # jobs because the name below contained "#72:").
      # The duckdb build must vet and test ALL packages — the fees-only
      # scope (pre-issue-72) was a gate blind spot; engine-availability
      # branches in other packages' tests skip explicitly.
      - name: go test (duckdb build, all packages)
        run: CGO_ENABLED=1 go test -count=1 -timeout 15m -tags duckdb ./...

  # Issue #38: the user's actual environment is Windows, so the test gate
  # must hold there too — the linux job alone let 15 platform failures
  # (TempDir cleanup, POSIX path assertions, chmod semantics) ship through
  # v0.7.0/v0.8.0. Mirrors the go job (frontend build included: the webui
  # tests embed internal/webui/dist). Windows minutes bill at 2x; the job
  # is worth that only because it is the user's platform.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build frontend (embedded by go:embed)
        run: cd web && npm ci && npm run build
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
        shell: bash
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 -timeout 25m ./...
