<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- NetOps Lab favicon：品牌色圆角方块 + 三节点拓扑（16px 下仍清晰） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F5FE0"/>
      <stop offset="1" stop-color="#5B83E8"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <g stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round">
    <line x1="12.1" y1="11.5" x2="19.9" y2="11.5"/>
    <line x1="11.2" y1="13.4" x2="14.4" y2="20.6"/>
    <line x1="20.8" y1="13.4" x2="17.6" y2="20.6"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="9.5" cy="11.5" r="2.8"/>
    <circle cx="22.5" cy="11.5" r="2.8"/>
    <circle cx="16" cy="22.5" r="2.8"/>
  </g>
</svg>
